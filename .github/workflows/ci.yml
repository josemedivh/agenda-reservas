name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: turnero
          POSTGRES_PASSWORD: turnero
          POSTGRES_DB: turnero
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U turnero -d turnero"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_MIGRATION_DATABASE_URL: postgresql://turnero_owner:turnero_owner@localhost:5432/turnero_test
      TEST_DATABASE_URL: postgresql://turnero_app:turnero_app@localhost:5432/turnero_test

    steps:
      - uses: actions/checkout@v7

      - name: Create database roles
        run: bash docker/postgres/init/01-roles.sh
        env:
          PGHOST: localhost
          PGPASSWORD: turnero
          POSTGRES_USER: turnero
          POSTGRES_DB: turnero

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

  images:
    name: Build Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      # Only checks that the images build; Railway builds its own from the same Dockerfiles.
      - name: API image
        run: docker build -f apps/api/Dockerfile -t turnero-api .

      - name: Web image
        run: >-
          docker build -f apps/web/Dockerfile
          --build-arg API_INTERNAL_URL=http://api.internal:3001
          --build-arg NEXT_PUBLIC_SITE_URL=https://turnero.example
          -t turnero-web .
